version: '3.8'

services:
  # ---------------------------------------------------------------------------
  # 1. CORE MESSAGING & DATABASE INFRASTRUCTURE
  # ---------------------------------------------------------------------------
  zookeeper:
    image: bitnami/zookeeper:3.9
    container_name: civic-zookeeper
    ports:
      - "2181:2181"
    environment:
      - ALLOW_ANONYMOUS_LOGIN=yes
    healthcheck:
      test: ["CMD-SHELL", "echo ruok | nc localhost 2181 || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - civic-network

  kafka:
    image: bitnami/kafka:3.7
    container_name: civic-kafka
    ports:
      - "9092:9092"
    depends_on:
      zookeeper:
        condition: service_healthy
    environment:
      - KAFKA_CFG_ZOOKEEPER_CONNECT=zookeeper:2181
      - KAFKA_CFG_LISTENERS=PLAINTEXT://0.0.0.0:9092,PLAINTEXT_INTERNAL://0.0.0.0:29092
      - KAFKA_CFG_ADVERTISED_LISTENERS=PLAINTEXT://localhost:9092,PLAINTEXT_INTERNAL://kafka:29092
      - KAFKA_CFG_LISTENER_SECURITY_PROTOCOL_MAP=PLAINTEXT:PLAINTEXT,PLAINTEXT_INTERNAL:PLAINTEXT
      - KAFKA_CFG_INTER_BROKER_LISTENER_NAME=PLAINTEXT_INTERNAL
      - KAFKA_CFG_OFFSETS_TOPIC_REPLICATION_FACTOR=1
      - KAFKA_CFG_TRANSACTION_STATE_LOG_REPLICATION_FACTOR=1
      - KAFKA_CFG_TRANSACTION_STATE_LOG_MIN_ISR=1
      - ALLOW_PLAINTEXT_LISTENER=yes
    healthcheck:
      test: ["CMD-SHELL", "/opt/bitnami/kafka/bin/kafka-topics.sh --bootstrap-server localhost:9092 --list"]
      interval: 10s
      timeout: 10s
      retries: 5
    networks:
      - civic-network

  kafka-init:
    image: bitnami/kafka:3.7
    container_name: civic-kafka-init
    depends_on:
      kafka:
        condition: service_healthy
    entrypoint: [ "/bin/sh", "-c" ]
    command:
      - |
        echo "Creating Kafka topics..."
        /opt/bitnami/kafka/bin/kafka-topics.sh --bootstrap-server kafka:29092 --create --if-not-exists --topic raw-sensor-events --partitions 3 --replication-factor 1
        /opt/bitnami/kafka/bin/kafka-topics.sh --bootstrap-server kafka:29092 --create --if-not-exists --topic raw-citizen-reports --partitions 3 --replication-factor 1
        /opt/bitnami/kafka/bin/kafka-topics.sh --bootstrap-server kafka:29092 --create --if-not-exists --topic alerts --partitions 3 --replication-factor 1
        /opt/bitnami/kafka/bin/kafka-topics.sh --bootstrap-server kafka:29092 --create --if-not-exists --topic config-updates --partitions 3 --replication-factor 1
        echo "Successfully created topics:"
        /opt/bitnami/kafka/bin/kafka-topics.sh --bootstrap-server kafka:29092 --list
    networks:
      - civic-network

  postgres:
    image: postgres:15-alpine
    container_name: civic-postgres
    ports:
      - "5432:5432"
    environment:
      - POSTGRES_DB=civic_pipeline
      - POSTGRES_USER=civic_user
      - POSTGRES_PASSWORD=civic_pass
    volumes:
      - ./apache-pipeline/postgres/init.sql:/docker-entrypoint-initdb.d/init.sql
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U civic_user -d civic_pipeline"]
      interval: 5s
      timeout: 5s
      retries: 5
    networks:
      - civic-network

  # ---------------------------------------------------------------------------
  # 2. AIRFLOW MAINTENANCE PIPELINE
  # ---------------------------------------------------------------------------
  airflow-postgres:
    image: postgres:15-alpine
    container_name: civic-airflow-postgres
    ports:
      - "5433:5432"
    environment:
      - POSTGRES_DB=airflow_db
      - POSTGRES_USER=airflow
      - POSTGRES_PASSWORD=airflow
    volumes:
      - airflow_postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U airflow -d airflow_db"]
      interval: 5s
      timeout: 5s
      retries: 5
    networks:
      - civic-network

  airflow-init:
    image: apache/airflow:2.9.1-python3.10
    container_name: civic-airflow-init
    depends_on:
      airflow-postgres:
        condition: service_healthy
    environment:
      - AIRFLOW__CORE__EXECUTOR=LocalExecutor
      - AIRFLOW__DATABASE__SQL_ALCHEMY_CONN=postgresql+psycopg2://airflow:airflow@airflow-postgres:5432/airflow_db
      - AIRFLOW__CORE__LOAD_EXAMPLES=False
    entrypoint: [ "/bin/sh", "-c" ]
    command:
      - |
        echo "Initializing Airflow database and admin user..."
        pip install psycopg2-binary pyarrow pandas kafka-python
        airflow db migrate
        airflow users create \
          --username admin \
          --firstname Admin \
          --lastname User \
          --role Admin \
          --email admin@civic.local \
          --password admin || true
    networks:
      - civic-network

  airflow-webserver:
    image: apache/airflow:2.9.1-python3.10
    container_name: civic-airflow-webserver
    restart: always
    depends_on:
      airflow-init:
        condition: service_completed_successfully
      airflow-postgres:
        condition: service_healthy
      postgres:
        condition: service_healthy
    ports:
      - "8080:8080"
    environment:
      - AIRFLOW__CORE__EXECUTOR=LocalExecutor
      - AIRFLOW__DATABASE__SQL_ALCHEMY_CONN=postgresql+psycopg2://airflow:airflow@airflow-postgres:5432/airflow_db
      - AIRFLOW__CORE__LOAD_EXAMPLES=False
      - _PIP_ADDITIONAL_REQUIREMENTS=psycopg2-binary pyarrow pandas kafka-python
      - PYTHONPATH=/opt/airflow
      - APP_DB_HOST=postgres
      - APP_DB_PORT=5432
      - APP_DB_NAME=civic_pipeline
      - APP_DB_USER=civic_user
      - APP_DB_PASS=civic_pass
    volumes:
      - ./apache-pipeline/dags:/opt/airflow/dags
      - ./archives:/opt/airflow/archives
      - ./apache-pipeline/postgres:/opt/airflow/postgres
      - ./apache-pipeline/spark:/opt/airflow/spark
      - ./apache-pipeline/scripts:/opt/airflow/scripts
    healthcheck:
      test: ["CMD-SHELL", "curl --fail http://localhost:8080/health || exit 1"]
      interval: 10s
      timeout: 10s
      retries: 5
    networks:
      - civic-network

  airflow-scheduler:
    image: apache/airflow:2.9.1-python3.10
    container_name: civic-airflow-scheduler
    restart: always
    depends_on:
      airflow-init:
        condition: service_completed_successfully
      airflow-postgres:
        condition: service_healthy
      postgres:
        condition: service_healthy
    environment:
      - AIRFLOW__CORE__EXECUTOR=LocalExecutor
      - AIRFLOW__DATABASE__SQL_ALCHEMY_CONN=postgresql+psycopg2://airflow:airflow@airflow-postgres:5432/airflow_db
      - AIRFLOW__CORE__LOAD_EXAMPLES=False
      - _PIP_ADDITIONAL_REQUIREMENTS=psycopg2-binary pyarrow pandas kafka-python
      - PYTHONPATH=/opt/airflow
      - APP_DB_HOST=postgres
      - APP_DB_PORT=5432
      - APP_DB_NAME=civic_pipeline
      - APP_DB_USER=civic_user
      - APP_DB_PASS=civic_pass
    volumes:
      - ./apache-pipeline/dags:/opt/airflow/dags
      - ./archives:/opt/airflow/archives
      - ./apache-pipeline/postgres:/opt/airflow/postgres
      - ./apache-pipeline/spark:/opt/airflow/spark
      - ./apache-pipeline/scripts:/opt/airflow/scripts
    healthcheck:
      test: ["CMD-SHELL", "airflow jobs check --job-type SchedulerJob --hostname \"$(hostname)\" || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 30s
    networks:
      - civic-network

  # ---------------------------------------------------------------------------
  # 3. SPARK STRUCTURED STREAMING CORRELATION ENGINE
  # ---------------------------------------------------------------------------
  spark-correlator:
    image: bitnami/spark:3.5.1
    container_name: civic-spark-correlator
    restart: always
    depends_on:
      kafka-init:
        condition: service_completed_successfully
      postgres:
        condition: service_healthy
    environment:
      - KAFKA_BOOTSTRAP_SERVERS=kafka:29092
      - POSTGRES_JDBC_URL=jdbc:postgresql://postgres:5432/civic_pipeline
      - POSTGRES_USER=civic_user
      - POSTGRES_PASSWORD=civic_pass
      - MIN_TRUST_THRESHOLD=0.6
    volumes:
      - ./apache-pipeline/spark:/opt/bitnami/spark/app
    command:
      - /opt/bitnami/spark/bin/spark-submit
      - --master
      - local[*]
      - --packages
      - org.apache.spark:spark-sql-kafka-0-10_2.12:3.5.1,org.postgresql:postgresql:42.7.3
      - /opt/bitnami/spark/app/stream_correlator.py
    healthcheck:
      test: ["CMD-SHELL", "curl --silent --fail http://localhost:4040 > /dev/null || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s
    networks:
      - civic-network

  # ---------------------------------------------------------------------------
  # 4. FASTAPI BACKEND SERVICE & KAFKA CONSUMER
  # ---------------------------------------------------------------------------
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: civic-backend
    restart: always
    ports:
      - "8000:8000"
    environment:
      - PORT=8000
      - HOST=0.0.0.0
      - LOG_LEVEL=INFO
      - DATABASE_URL=postgresql://civic_user:civic_pass@postgres:5432/civic_pipeline
      - KAFKA_BOOTSTRAP_SERVERS=kafka:29092
      - CORS_ORIGINS=["*"]
    depends_on:
      postgres:
        condition: service_healthy
      kafka-init:
        condition: service_completed_successfully
    healthcheck:
      test: ["CMD-SHELL", "curl --fail http://localhost:8000/api/healthz || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - civic-network

  # ---------------------------------------------------------------------------
  # 5. REACT COMMAND CENTER FRONTEND
  # ---------------------------------------------------------------------------
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: civic-frontend
    restart: always
    ports:
      - "5173:80"
    depends_on:
      backend:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "curl --fail http://localhost:80 || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 3
    networks:
      - civic-network

  # ---------------------------------------------------------------------------
  # 6. AMBIENT SCENARIO SIMULATOR (BACKGROUND AMBIENT PRODUCER)
  # ---------------------------------------------------------------------------
  simulator:
    image: python:3.10-slim
    container_name: civic-ambient-simulator
    restart: always
    depends_on:
      backend:
        condition: service_healthy
    environment:
      - BACKEND_SIMULATE_URL=http://backend:8000/api/simulate
      - INTERVAL_SECONDS=35
    volumes:
      - ./scripts:/app/scripts
    command: ["python", "/app/scripts/ambient_simulator.py"]
    healthcheck:
      test: ["CMD-SHELL", "pgrep -f ambient_simulator.py || exit 1"]
      interval: 30s
      timeout: 5s
      retries: 3
    networks:
      - civic-network

volumes:
  postgres_data:
  airflow_postgres_data:

networks:
  civic-network:
    driver: bridge
